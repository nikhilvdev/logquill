# Verbatim reference copies and machine-written fixtures stay exactly as they were produced.
exclude: ^(docs/legacy/|docs/spec/legacy-tests/|docs/kibana/|schema/.*\.json$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH"; cargo fmt --all --check'
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: sh -c 'PATH="$HOME/.cargo/bin:$PATH"; cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false
