[workspace]
resolver = "2"
members = ["crates/*"]
# Built by maturin / the napi CLI with their own lockfiles, so `cargo test --workspace` needs neither
# a Python nor a Node installation, and the binding macros (which expand to `unsafe`) stay out.
exclude = ["bindings/python", "bindings/node"]

[workspace.package]
version = "3.0.0-dev.0"
edition = "2021"
rust-version = "1.80"
# The licence for the shared core is an open decision (docs/rust-core-plan.md, section 8);
# until it is settled the crates point at the repository's LICENSE file.
license-file = "LICENSE"
publish = false # nothing is published until the release stage

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
