[workspace]
resolver = "2"
members = ["crates/*"]
# Built by maturin / the napi CLI with their own lockfiles, so `cargo test --workspace` needs neither
# a Python nor a Node installation, and the binding macros (which expand to `unsafe`) stay out.
exclude = ["bindings/python", "bindings/node", "bindings/wasm"]

[workspace.package]
version = "3.0.0-rc.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/nikhilvdev/logquill"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
