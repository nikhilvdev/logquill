[package]
name = "logquill-runtime"
description = "LogQuill runtime: the bounded queue and worker, and the native transports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes = "0.8.4"
base64 = "0.23.1"
cbc = { version = "0.1.2", features = ["alloc"] }
flate2 = "1.1.10"
gethostname = "1.1.0"
getrandom = "0.4.3"
hmac = "0.12.1"
lettre = { version = "0.11.19", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
logquill-core = { version = "3.0.0-rc.3", path = "../logquill-core" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10.9"
ureq = "3.2.1"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
