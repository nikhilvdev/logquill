# Generates include/logquill.h:  cbindgen --config cbindgen.toml --crate logquill-ffi --output include/logquill.h
# CI regenerates it and fails if the committed copy differs.
language = "C"
include_guard = "LOGQUILL_H"
header = "/* LogQuill C ABI. Generated by cbindgen from crates/logquill-ffi: do not edit by hand. */"
documentation = true
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true

[parse]
parse_deps = false
