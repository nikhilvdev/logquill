[package]
name = "logquill-ffi"
description = "LogQuill's stable C ABI: a Logger handle and the core's helpers, for hosts that load a shared library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "logquill_ffi"
# cdylib for P/Invoke and the `ffi` gem, staticlib for Swift / C, rlib for this crate's own tests
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
logquill-core = { version = "3.0.0-rc.1", path = "../logquill-core" }
# Optional: the worker thread and the console / file transports. A WebAssembly build (`wasm32-wasip1`, for Go) leaves
# it out: no threads or sockets there, so the logger is the pipeline only and the host writes the records.
logquill-runtime = { version = "3.0.0-rc.1", path = "../logquill-runtime", optional = true }
base64 = "0.23.1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

[features]
default = ["runtime"]
runtime = ["dep:logquill-runtime"]

# Not `[lints] workspace = true`: a C ABI is `unsafe` by nature (the workspace forbids it). All of it is in `src/lib.rs`;
# the logic is in safe modules.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
