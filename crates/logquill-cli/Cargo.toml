[package]
name = "logquill-cli"
description = "The logquill command: tail, trace, dev, serve and verify."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "logquill"
path = "src/main.rs"

[dependencies]
logquill-core = { path = "../logquill-core" }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
# Argument parsing for the subcommands (only `verify` so far).
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
