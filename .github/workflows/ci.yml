name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects the toolchain and components; cargo installs them on first use.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Timing is only meaningful optimised; the budget is a ratio to serialising, so it travels across runners.
      - run: cargo test --release -p logquill-runtime-checks --test timing

  # The queue and worker are the only hand-rolled concurrency in the runtime; Miri checks them
  # for undefined behaviour and data races. Needs nightly, so it is its own job.
  miri:
    name: miri (worker and queue)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test -p logquill-runtime --test runtime -- tasks_run drop_ block_ closing_ drain_ the_worker
        env:
          # ignore-leaks: the simulated-fork test abandons the "parent" worker thread on purpose.
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-ignore-leaks

  # The Python binding lives outside the Cargo workspace (its macros need `unsafe`, and building it
  # needs Python), so it has its own job: build the wheel in place, test it, lint the Rust.
  python:
    name: python binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m venv .venv && .venv/bin/pip install maturin pytest "hypothesis>=6.100"
      - run: python3 -m venv /tmp/logquill-old && /tmp/logquill-old/bin/pip install logquill==2.0.0
      - run: .venv/bin/maturin develop
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/bindings/python/.venv
      # the oracle tests compare every scenario against the published 2.0.0
      - run: .venv/bin/python -m pytest -q
        env:
          LOGQUILL_ORACLE_PYTHON: /tmp/logquill-old/bin/python
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # latency against 2.0.0 needs an optimised build; fails if a caller-side row is over the margin
      - run: .venv/bin/maturin develop --release
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/bindings/python/.venv
      - run: .venv/bin/python bench/compare.py /tmp/logquill-old/bin/python ${{ github.workspace }}/bindings/python/.venv/bin/python
      # install-and-run from a built wheel in a clean environment, with no source tree on the path
      - run: |
          .venv/bin/maturin build --release -o dist
          python3 -m venv /tmp/smoke && /tmp/smoke/bin/pip install dist/*.whl
          test -z "$(unzip -l dist/*.whl | grep -E '__pycache__|\.pyc')"
          cd /tmp && /tmp/smoke/bin/python -I -c "
          import json, os, tempfile, logquill
          p = os.path.join(tempfile.mkdtemp(), 'a.log')
          log = logquill.Logger('smoke', transports=[logquill.FileTransport(p)], meta={'service': 'x'})
          log.info('hello', n=1)
          log.close()
          rec = json.loads(open(p).read())
          assert rec['meta'] == {'service': 'x', 'n': 1} and rec['schema_version'] == '2.0', rec
          print('smoke ok')
          "

  # PyO3 builds free-threaded CPython from 3.14 on, and not as abi3, so this is its own job.
  python-free-threaded:
    name: python binding (3.14t, GIL off)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install uv && uv venv --python 3.14t .venv-ft
      - run: uv pip install --python .venv-ft/bin/python maturin pytest "hypothesis>=6.100"
      - run: .venv-ft/bin/maturin develop --release
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/bindings/python/.venv-ft
      - run: .venv-ft/bin/python -c "import sys; assert not sys._is_gil_enabled()"
      - run: .venv-ft/bin/python -X gil=0 -m pytest -q

  # The Node binding lives outside the Cargo workspace for the same reason the Python one does, so it
  # has its own job. Uses the Node that ships on the runner; the LTS matrix comes with slice 7.
  node:
    name: node binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      # the WebAssembly fallback: the core without the runtime, for platforms with no native build
      - run: rustup target add wasm32-wasip1-threads
      - run: npm run build:wasm
      - run: node --test "tests/*.test.mjs"
        env:
          NAPI_RS_FORCE_WASI: "true"
      - run: npx vitest run
        env:
          NAPI_RS_FORCE_WASI: "true"
      - run: npm test
      # the Node LTS lines, from the `node` npm package so no unpinned action is needed
      - run: npx -y -p node@22 node --test "tests/*.test.mjs"
      - run: npx -y -p node@24 node --test "tests/*.test.mjs"
      - run: npx tsc --noEmit
      - run: npm run build:sdk
      # load the built bundles as a consumer would, as ESM and as CommonJS
      - run: npm run smoke
      - run: npx -y -p node@22 node scripts/smoke.mjs
      - run: npx -y -p node@24 node scripts/smoke.mjs
      # pack the package and a platform package, install both into a clean project, import by name
      - run: npm run pack-smoke
      - run: npx -y -p node@22 node scripts/pack-smoke.mjs
      - run: npx -y -p node@24 node scripts/pack-smoke.mjs
      # the SDK suite twice: on the Rust file transport, then with the addon off (the pure-JS fallback)
      - run: npx vitest run
      - run: npx vitest run
        env:
          LOGQUILL_NO_NATIVE: "1"
      - run: cargo fmt --check
      # the library only: in the test-harness build napi's registration macros compile away and
      # every exported item looks unused
      - run: cargo clippy -- -D warnings

  wasm:
    name: wasm binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            sha256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
          - os: macos-latest
            target: aarch64-apple-darwin
            sha256: 81d4a23d56b3c3eb8187658329116d50e0b228a93b343825fb71f70179051cd1
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-unknown-unknown
      # the CLI has to be exactly the version Cargo.toml pins; the prebuilt release, checked against a pinned hash,
      # saves compiling it (several minutes) on every run
      - name: install wasm-bindgen 0.2.129
        run: |
          v=0.2.129
          curl -fsSL -o "$RUNNER_TEMP/wbg.tgz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-${{ matrix.target }}.tar.gz"
          (cd "$RUNNER_TEMP" && echo "${{ matrix.sha256 }}  wbg.tgz" | shasum -a 256 -c - && tar -xzf wbg.tgz)
          echo "$RUNNER_TEMP/wasm-bindgen-$v-${{ matrix.target }}" >> "$GITHUB_PATH"
      - run: node --version && npm --version
      - run: npm ci --ignore-scripts
      # Bun's launcher links its binary in a postinstall script, the one install script this job needs
      - run: npm rebuild bun
      # build the module and the SDK, then the corpus in Node, Deno, Bun, headless Chrome and a Worker (workerd),
      # then the size and speed budget
      - run: npm test
      - run: npx tsc --noEmit
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  # ---- Stage 8: the C ABI and the medium-tier bindings built on it ----------------------------------------------------
  ffi:
    name: C ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build -p logquill-ffi
      # the header is generated; the committed copy must be what cbindgen produces now, and a C program must build against it
      - run: cargo install cbindgen --locked
      - run: crates/logquill-ffi/tests/c/run.sh
      # the shared corpus through the C ABI (Deno's FFI): every stateless group, 815 checks
      - run: npm ci --ignore-scripts && npm run build:hosts
        working-directory: bindings/wasm
      - run: bindings/wasm/node_modules/.bin/deno run --allow-ffi --allow-read --allow-env crates/logquill-ffi/tests/deno/run.mjs
      # the build with no runtime, for WebAssembly hosts (Go)
      - run: rustup target add wasm32-wasip1
      - run: cargo clippy -p logquill-ffi --target wasm32-wasip1 --no-default-features -- -D warnings

  ruby:
    name: ruby binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: bindings/ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo build -p logquill-ffi --release
        working-directory: .
      - run: ruby --version && gem install ffi minitest --no-document --user-install  # the runner's system Ruby is not writable
      - run: ruby -Ilib test/test_logquill.rb && ruby -Ilib test/test_readme.rb
      - run: ruby scripts/pack_smoke.rb

  dotnet:
    name: dotnet binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: dotnet --list-sdks
      - run: cargo build -p logquill-ffi --release
      - run: dotnet test bindings/dotnet/tests/LogQuill.Tests
      - run: bindings/dotnet/scripts/pack-smoke.sh

  go:
    name: go binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: bindings/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the macOS runner image has no Go; the Ubuntu one does
      - run: brew install go
        if: runner.os == 'macOS'
      - run: go version
      - run: rustup target add wasm32-wasip1 && scripts/build-core.sh
      - run: test -z "$(gofmt -l .)" && go vet ./...
      - run: go test -race ./...
      - run: go test -run '^$' -bench . -benchtime 1s
      - run: scripts/consumer-smoke.sh

  swift:
    name: swift binding (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bindings/swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version && xcodebuild -version
      # with full Xcode on the runner this goes through `xcodebuild -create-xcframework`, the path not exercised locally
      - run: scripts/build-xcframework.sh
      - run: swift build && swift run LogQuillChecks
      - run: scripts/smoke.sh

  jvm:
    name: jvm binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: java -version && gradle --version
      - run: cargo build -p logquill-ffi --release
      - run: gradle --no-daemon test
        working-directory: bindings/jvm
      - run: bindings/jvm/scripts/pack-smoke.sh
