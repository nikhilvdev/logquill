[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "logquill"
version = "3.0.0rc2"
description = "Structured, agent-aware logging with pluggable transports and a plugin pipeline, on a Rust core."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "async-logging",
    "json-logging",
    "logger",
    "logging",
    "observability",
    "plugins",
    "structured-logging",
    "transports",
    "opentelemetry",
    "llm",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nikhilvdev/logquill"
Repository = "https://github.com/nikhilvdev/logquill"
Issues = "https://github.com/nikhilvdev/logquill/issues"

[project.optional-dependencies]
# Transports and plugins that talk to a service need that service's client library.
apprise = ["apprise>=1.8"]
aws = ["boto3>=1.34"]
gcp-logging = ["google-cloud-logging>=3.10"]
pubsub = ["google-cloud-pubsub>=2.21"]
kafka = ["kafka-python>=2.0"]
rabbitmq = ["pika>=1.3"]
mongodb = ["pymongo>=4.6"]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg2-binary>=2.9"]
redis = ["redis>=5.0"]
neo4j = ["neo4j>=5.20"]
falkordb = ["falkordb>=1.0"]
http = ["aiohttp>=3.9"]
yaml = ["pyyaml>=6.0"]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
otel = [
    "opentelemetry-api>=1.39",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
]
# Framework adapters and SDK patching.
langchain = ["langchain-core>=0.3"]
langgraph = ["langgraph>=1.0"]
crewai = ["crewai>=1.0"]
autogen = ["autogen-core>=0.6"]
llamaindex = ["llama-index-core>=0.12"]
openai-agents = ["openai-agents>=0.0.3"]
instrument-anthropic = ["anthropic>=0.40"]
instrument-openai = ["openai>=1.50"]
instrument-litellm = ["litellm>=1.50"]
# Kept so `pip install logquill[fast]` and `logquill[crypto]` from 2.x still work: the JSON
# backend and the Fernet encryption are part of the Rust core now.
fast = []
crypto = []
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.maturin]
python-source = "python"
module-name = "logquill._native"
manifest-path = "Cargo.toml"
# maturin packs the working tree, not the git index: keep stale bytecode out of the wheel
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
